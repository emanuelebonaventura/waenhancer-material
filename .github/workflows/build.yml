name: Build WaEnhancer + Material chat

# Two checks a day: when Dev4Mod publishes a new release, the upstream tag is
# cloned, our patches are applied on top, and the signed APK is published as
# "<upstream tag>-material". If a patch no longer applies, an issue is opened.
on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (empty = latest release)'
        required: false
      force:
        description: 'Rebuild even if the release already exists'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['patches/**', '.github/workflows/build.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Dev4Mod/waenhancer
  CONFLICT_TITLE_PREFIX: 'Patches do not apply on'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: patches-repo

      - name: Find upstream release
        id: up
        run: |
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          fi
          [ -n "$TAG" ] || { echo "::error::Upstream release not found"; exit 1; }
          OUR_TAG="$TAG-material"
          FORCE="${{ inputs.force }}"
          # A change to the patches always rebuilds the current release.
          [ "${{ github.event_name }}" = "push" ] && FORCE=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "our_tag=$OUR_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$OUR_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$OUR_TAG already published, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Building $OUR_TAG"
          fi

      - name: Clone upstream
        if: steps.up.outputs.skip == 'false'
        run: git clone --branch "${{ steps.up.outputs.tag }}" --recurse-submodules "https://github.com/$UPSTREAM_REPO.git" upstream

      - name: Apply patches
        id: apply
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git am --3way ../patches-repo/patches/*.patch > ../am.log 2>&1; then
            cat ../am.log
            exit 0
          fi
          cat ../am.log
          {
            echo "The patches no longer apply on upstream \`${{ steps.up.outputs.tag }}\`: no release was published."
            echo
            echo "**Patch:** \`$(git am --show-current-patch=raw 2>/dev/null | sed -n 's/^Subject: //p' | head -1)\`"
            echo
            echo "**Conflicting files:**"
            git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
            echo
            echo '<details><summary>git am log</summary>'
            echo
            echo '```'
            cat ../am.log
            echo '```'
            echo '</details>'
            echo
            echo 'To fix: rebase `material-chat` onto the new tag in the local clone, resolve, then run `scripts/update-patches.sh` and push.'
          } > ../issue.md
          exit 1

      - name: Open conflict issue
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          TITLE="$CONFLICT_TITLE_PREFIX ${{ steps.up.outputs.tag }}"
          OPEN=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue.md
          fi

      - name: Stamp release tag into versionName
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          # The in-app update checks (patched to read this repo's releases) look for
          # the release tag in versionName; our commit hash differs from the upstream
          # one, so without this they would always report an update.
          OUR_TAG="${{ steps.up.outputs.our_tag }}"
          if [ "$(grep -c -E '^\s*versionName = "[^"]*"' app/build.gradle.kts)" = "1" ]; then
            sed -i -E "s/^(\s*versionName = \"[^\"]*)(\")/\1 $OUR_TAG\2/" app/build.gradle.kts
            grep -E '^\s*versionName' app/build.gradle.kts
          else
            echo "::warning::versionName not found: the app will keep reporting an update"
          fi

      - uses: actions/setup-java@v5
        if: steps.up.outputs.skip == 'false'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            upstream/**/*.gradle*
            upstream/**/gradle-wrapper.properties
            upstream/gradle/libs.versions.toml

      - name: Write signing key
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without our key Gradle would sign with the runner's random debug key,
          # and the APK would not install over the one on the phone.
          if [ -z "$KEY_STORE" ]; then
            echo "::error::Secret KEY_STORE missing (see README)"
            exit 1
          fi
          echo "$KEY_STORE" | base64 --decode > key.jks
          {
            echo "androidStoreFile=key.jks"
            echo "androidStorePassword=$KEY_STORE_PASSWORD"
            echo "androidKeyAlias=$ALIAS"
            echo "androidKeyPassword=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Build
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleWhatsappDebug -Pminify=true

      - name: Publish release
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          TAG="${{ steps.up.outputs.tag }}"
          OUR_TAG="${{ steps.up.outputs.our_tag }}"
          VERSION=$(sed -n 's/.*versionName = "\([^ ]*\).*/\1/p' app/build.gradle.kts | head -1)
          APK_SRC=$(ls app/build/outputs/apk/whatsapp/debug/*.apk | head -1)
          APK="../WaEnhancer-$VERSION-material-${TAG##*-}.apk"
          cp "$APK_SRC" "$APK"
          {
            echo "WaEnhancer $VERSION built from upstream [\`$TAG\`](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG) with the patches:"
            echo
            for p in ../patches-repo/patches/*.patch; do
              echo "- $(sed -n 's/^Subject: \[PATCH[^]]*\] //p' "$p" | head -1)"
            done
            echo
            echo "### Upstream changelog"
            echo
            cat changelog.txt 2>/dev/null || true
          } > ../notes.md
          gh release delete "$OUR_TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$OUR_TAG" "$APK" -R "$GITHUB_REPOSITORY" \
            --title "WaEnhancer $VERSION + Material chat" --notes-file ../notes.md --target main

      - name: Close conflict issues
        if: steps.up.outputs.skip == 'false'
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$CONFLICT_TITLE_PREFIX\"" --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} -R "$GITHUB_REPOSITORY" -c "Fixed: ${{ steps.up.outputs.our_tag }} published."
